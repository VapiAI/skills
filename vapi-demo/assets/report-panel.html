<!-- ============================================================ EDIT 4 of 4
     RENDER. Add outcomeRender() next to the other render functions, then call
     it from the SSE `case 'call.report':` branch (add the one marked line).

       case 'call.report':
         setStatus('Call ended', false);
         etaState = 'off';
         transcriptSettle();
         outcomeRender(d);          // <-- add this line
         endedCallMark(d.callId);
         break;
-->

<script>
// Structured outputs arrive keyed by structured-output id, each carrying its own
// name and result: { "<so-id>": { name: "booking_made", result: true } }. Some
// results are objects, so stringify anything that is not a scalar. A demo with
// no structured outputs configured still gets the ended reason, which is why
// this panel is safe to ship before anyone decides what to measure.
function outcomeRender(d) {
  panelReady('outcome');
  const rows = [];
  if (d.endedReason) rows.push({ k: 'Ended', v: String(d.endedReason).replace(/-/g, ' ') });
  for (const so of Object.values(d.structuredOutputs ?? {})) {
    const value = (so && typeof so === 'object') ? so.result : so;
    rows.push({
      k: (so?.name ?? 'output').replace(/_/g, ' '),
      v: (value !== null && typeof value === 'object') ? JSON.stringify(value) : String(value),
      good: value === true,
    });
  }
  if (!rows.length) rows.push({ k: 'Report', v: 'no outputs configured' });
  $('outcome').innerHTML = rows
    .map(r => '<div class="outcome-row' + (r.good ? ' good' : '') + '">'
      + '<span class="k"></span><span class="v"></span></div>')
    .join('');
  // Fill via textContent so a result can never inject markup into the page.
  [...$('outcome').children].forEach((el, i) => {
    el.querySelector('.k').textContent = rows[i].k;
    el.querySelector('.v').textContent = rows[i].v;
  });
}
</script>
